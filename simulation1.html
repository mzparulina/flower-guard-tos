<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Diamond Garden — Center Initial + Level</title>

<style>
:root{
  --bg:#0b1020;
  --panel: rgba(255,255,255,.06);
  --panel2: rgba(255,255,255,.10);

  --open-bg: rgba(120,255,190,.18);
  --open-bd: rgba(120,255,190,.45);

  --closed-bg: rgba(255,120,160,.12);
  --closed-bd: rgba(255,120,160,.28);

  --center-bg: rgba(120,170,255,.22);
  --center-bd: rgba(120,170,255,.40);

  --node: 170px;
  --padIn: 10px;
  --gap: 8px;
  --margin: 36px;
}

*{ box-sizing:border-box; }

body{
  margin:0;
  padding:24px;
  background:
    radial-gradient(900px 400px at 50% -20%, rgba(120,170,255,.15), transparent 60%),
    radial-gradient(900px 600px at 10% 10%, rgba(255,120,220,.08), transparent 60%),
    radial-gradient(900px 600px at 90% 30%, rgba(120,255,190,.06), transparent 60%),
    var(--bg);
  font-family: system-ui, sans-serif;
  color:#e7ecff;
}

.viewport{
  width:min(1400px,100%);
  margin:auto;
  overflow:auto;
  border-radius:18px;
  border:1px solid rgba(255,255,255,.10);
  background:rgba(255,255,255,.03);
  backdrop-filter: blur(10px);
  padding:10px;
}

.garden{
  position:relative;
  margin:auto;
}

.node{
  width:var(--node);
  height:var(--node);
  padding:var(--padIn);
  border-radius:18px;
  background:linear-gradient(180deg,var(--panel2),var(--panel));
  border:1px solid rgba(255,255,255,.14);
  box-shadow:0 10px 18px rgba(0,0,0,.25);
}

.slots{
  height:100%;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  grid-template-rows:repeat(3,1fr);
  gap:var(--gap);
}

.slot{
  border-radius:14px;
  border:1px solid rgba(255,255,255,.12);
  background:rgba(231,236,255,.05);
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
}

.slot.open{ background:var(--open-bg); border-color:var(--open-bd); }
.slot.closed{ background:var(--closed-bg); border-color:var(--closed-bd); }

.slot.center{
  background:var(--center-bg);
  border-color:var(--center-bd);
  font-weight:900;
  font-size:13px;
  letter-spacing:.4px;
}

/* single overlap indicator */
.slot.overlap::after{
  content:"";
  position:absolute;
  inset:6px;
  border-radius:10px;
  border:2px solid rgba(120,170,255,.78);
  box-shadow:0 0 12px rgba(120,170,255,.35);
}
</style>
</head>

<body>
<div class="viewport">
  <div class="garden" id="garden"></div>
</div>

<script>
/* ===== DATA ===== */
const flowerLevels = {
  kumquat:1, strawbie:1, sweetCherry:4, unknown:0,
  lacordini:9, lullashroom:5, lacelap:5,
  windchime:9, passionCoconut:5
};

const sharedPlants = {
  P1:{strawbie:"NE",kumquat:"W"},
  P2:{strawbie:"E", kumquat:"SW"},
  P3:{kumquat:"E",sweetCherry:"NW"},
  P4:{kumquat:"SE",sweetCherry:"W"},
  P5:{unknown:"N",strawbie:"SW"},
  P6:{unknown:"NE",strawbie:"S"},
  P7:{lacordini:"NW",strawbie:"SE"},
  P8:{lacordini:"NE",sweetCherry:"SW"},
  P9:{lullashroom:"NW",sweetCherry:"S"},
  P10:{lullashroom:"N",sweetCherry:"SE"},
  P11:{lacelap:"NW",unknown:"S"},
  P12:{lacelap:"NE",lacordini:"SW"},
  P13:{windchime:"NW",lacordini:"SE"},
  P14:{windchime:"N",lullashroom:"SW"},
  P15:{windchime:"NE",lullashroom:"S"},
  P16:{passionCoconut:"NW",lacelap:"E"},
  P17:{passionCoconut:"W",lacelap:"SE"},
  P18:{passionCoconut:"NE",windchime:"W"},
  P19:{passionCoconut:"E",windchime:"SW"}
};

/* ===== LOGIC ===== */
function unlocked(level){
  const s=new Set();
  if(level>=1) ["N","S","E","W"].forEach(d=>s.add(d));
  if(level>=3) s.add("NW");
  if(level>=5) s.add("NE");
  if(level>=7) s.add("SW");
  if(level>=9) s.add("SE");
  return s;
}

const slotOrder=["NW","N","NE","W","C","E","SW","S","SE"];

/* overlap owner: higher level wins, tie → alphabetical */
function buildOverlapOwner(shared, levels){
  const map={};
  for(const pair of Object.values(shared)){
    const [a,b]=Object.keys(pair);
    const la=levels[a]??0, lb=levels[b]??0;
    let owner = la>lb ? a : lb>la ? b : [a,b].sort()[0];
    map[owner] ??= {};
    map[owner][pair[owner]] = true;
  }
  return map;
}
const overlapOwner = buildOverlapOwner(sharedPlants, flowerLevels);

/* layout alignment */
const dirRC={
  NW:[0,0],N:[0,1],NE:[0,2],
  W:[1,0], C:[1,1], E:[1,2],
  SW:[2,0],S:[2,1],SE:[2,2]
};

function buildEdges(shared){
  const m=new Map();
  const add=(a,b,dr,dc)=>{
    m.has(a)||m.set(a,[]);
    m.get(a).push({b,dr,dc});
  };
  for(const pair of Object.values(shared)){
    const [a,b]=Object.keys(pair);
    const [ra,ca]=dirRC[pair[a]];
    const [rb,cb]=dirRC[pair[b]];
    add(a,b,ra-rb,ca-cb);
    add(b,a,rb-ra,cb-ca);
  }
  return m;
}

function solve(edges, anchor){
  const pos={[anchor]:{r:0,c:0}};
  const q=[anchor];
  while(q.length){
    const cur=q.shift();
    for(const e of edges.get(cur)||[]){
      if(pos[e.b]) continue;
      pos[e.b]={r:pos[cur].r+e.dr,c:pos[cur].c+e.dc};
      q.push(e.b);
    }
  }
  return pos;
}

const edges=buildEdges(sharedPlants);
const stepPos=solve(edges,"kumquat");

/* pixel math */
const cs=getComputedStyle(document.documentElement);
const NODE=parseFloat(cs.getPropertyValue("--node"));
const PAD=parseFloat(cs.getPropertyValue("--padIn"));
const GAP=parseFloat(cs.getPropertyValue("--gap"));
const slotSize=(NODE-(PAD*2)-(GAP*2))/3;
const stepPx=slotSize+GAP;
const MARGIN=36;

let minR=0,minC=0,maxR=0,maxC=0;
Object.values(stepPos).forEach(p=>{
  minR=Math.min(minR,p.r); minC=Math.min(minC,p.c);
  maxR=Math.max(maxR,p.r); maxC=Math.max(maxC,p.c);
});

const shiftR=-minR, shiftC=-minC;
const garden=document.getElementById("garden");
garden.style.width = `${MARGIN*2+(maxC+shiftC)*stepPx+NODE}px`;
garden.style.height= `${MARGIN*2+(maxR+shiftR)*stepPx+NODE}px`;

/* render */
Object.keys(flowerLevels).forEach(f=>{
  const open=unlocked(flowerLevels[f]);
  const wrap=document.createElement("div");
  wrap.style.position="absolute";
  wrap.style.left=`${MARGIN+(stepPos[f].c+shiftC)*stepPx}px`;
  wrap.style.top =`${MARGIN+(stepPos[f].r+shiftR)*stepPx}px`;

  const node=document.createElement("div");
  node.className="node";
  const grid=document.createElement("div");
  grid.className="slots";

  slotOrder.forEach(d=>{
    const s=document.createElement("div");
    s.className="slot";
    if(d==="C"){
      s.classList.add("center");
      s.textContent = `${f[0]}:${flowerLevels[f]}`;
    }else{
      s.classList.add(open.has(d)?"open":"closed");
      if(overlapOwner?.[f]?.[d]) s.classList.add("overlap");
    }
    grid.appendChild(s);
  });

  node.appendChild(grid);
  wrap.appendChild(node);
  garden.appendChild(wrap);
});
</script>
</body>
</html>
